[workspace]
members = [
    "crates/rscterm-cli",
    "crates/rscterm-core",
    "crates/rscterm-provider",
    "crates/rscterm-gitflow"
]

[workspace.dependencies]
tokio = { version = "1.36.0", features = ["full"] }
anyhow = "1.0.79"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
git2 = "0.18"
tempfile = "3.10"

[package]
name = "rscterm"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A minimalistic, compact, and high-performance Rust implementation of the AIbitat multi-agent conversation framework"

[[bin]]
name = "rscterm"
path = "src/bin/rscterm.rs"

[[bin]]
name = "gitflow-hook"
path = "crates/rscterm-gitflow/src/bin/gitflow-hook.rs"

[dependencies]
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
crossterm = "0.27"
ratatui = "0.26"
chrono = "0.4"
rustyline = "13.0"
shell-words = "1.1"
indicatif = "0.17"
rand = "0.8"
rscterm-cli = { path = "crates/rscterm-cli" }
rscterm-provider = { path = "crates/rscterm-provider" }
rscterm-gitflow = { path = "crates/rscterm-gitflow" }

[dev-dependencies]
tokio-test = "0.4"
assert_matches = "1.5"
