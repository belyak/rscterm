[package]
name = "rscterm-gitflow"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
git2.workspace = true
tempfile.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.10"
thiserror = "1.0"
rscterm-core = { path = "../rscterm-core" }

[[bin]]
name = "gitflow-hook"
path = "src/bin/gitflow-hook.rs"

[dev-dependencies]
tempfile.workspace = true
git2.workspace = true
